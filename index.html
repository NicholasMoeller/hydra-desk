<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="apple-mobile-web-app-title" content="HYDRA">

  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAIAAACyr5FlAAACBUlEQVR42u3cMU4DQRBE0QktS1yFiNAn4KQcjWMQOCXd2anqJ/3YtHreLiMLsR7PD+nflhUIDsEhOASH4BAcgkNwCA7BIcEhOASH4BAcgkNwCA7BITgkOASH4BAcgkNwCA7BITgEhwSH4BAcgkNwCA7BITgEh+AQHBIcgkNwCA7BITgEh+AQHIJDgkNwCA7BITgEh+AQHIIjq9+f73cRHwvHDTIuDQ444CCDDzjggAMOOG6VUexjEI6ID4cjWMYoH3DAAQcccOy5MA65lsIBBxxwDMex7XuIIV94LFdR11I44BiM45aj6vYBBxwjcXT/XDgCnuDilwcccFTjuP14Wn3AAQcccAzEccjBVPqAAw444JiG46gj6fMBBxxwwDEKx4GHUeYDDjhm4DAVHEc/o00vDzjg6MJx+AHU+IADDjiMNwFHxOo7fMABBxyGrMcRtPQCH3AYFQ6jduOIW3e6DzgMXIrDzHAEP4XRLw84jB2OI3rFucOv/XuZ9r/oc5ewQpcCx4Y9XIXj8+ulbcEhOFSP49LftTV/vTb0zqGC4BAcgkNwCA7BITgEh+AQHIJDgkNwCA7BITgEh+AQHIJDcEhwCA7BITgEh+AQHIJDcAgOCQ7BITgEh+AQHIJDcAgOwSE4JDgEh+AQHIJDcAgOwSE4BIcEh+AQHIJDcAgOwSE4BIcG9Qc0FfnDpjd3awAAAABJRU5ErkJggg==">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #14171c; color: #f3f5f7; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 16px 32px; }
    h1 { font-size: 34px; letter-spacing: -0.03em; margin: 0 0 8px; }
    p { color: #c5ccd6; line-height: 1.4; }
    a { color: #e8a84a; }
    input { width: 100%; box-sizing: border-box; margin: 8px 0 12px; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: #1c222b; color: inherit; font: inherit; }
    button { background: #e8a84a; color: #2a1d08; border: 0; border-radius: 12px; padding: 12px 16px; font: inherit; font-weight: 700; }
    .err { color: #ffb4b4; }
  </style>
</head>
<body>
  <main id="setup">
    <h1>HYDRA</h1>
    <p>This step is once. After it, open the HYDRA icon and the latest notes load. The computer does not stay on.</p>
    <p><a href="https://github.com/settings/tokens/new?scopes=repo&amp;description=HYDRA%20iPhone">Make a read key</a>. Turn on the repo box if it is not already on. Copy the key and paste it here. It stays on this phone.</p>
    <input id="read-key" type="password" autocomplete="off" placeholder="Paste the key">
    <button type="button" id="save-key">Save on this phone</button>
    <p id="msg" class="err"></p>
    <p>Then tap Share, Add to Home Screen, and name it HYDRA.</p>
  </main>
  <div class="stage" id="desk" hidden>
    <div id="device"><div id="app"></div></div>
  </div>
  <script type="module">
    const REPO = "NicholasMoeller/Grok-Bot-Options-Trading";
    const KEY = "hydraToken";
    const FILES = [
      "iphone/www/markdown.js",
      "iphone/www/gates.js",
      "iphone/www/remote.js",
      "iphone/www/styles.css",
      "iphone/www/app.js",
    ];

    function msg(text) {
      document.getElementById("msg").textContent = text || "";
    }

    async function gh(path, token) {
      const url = "https://api.github.com/repos/" + REPO + "/contents/" + path.split("/").map(encodeURIComponent).join("/") + "?ref=main";
      const res = await fetch(url, {
        cache: "no-store",
        headers: {
          Authorization: "Bearer " + token,
          Accept: "application/vnd.github.raw",
          "X-GitHub-Api-Version": "2022-11-28",
        },
      });
      if (res.status === 401 || res.status === 403) {
        const err = new Error("key");
        err.code = "key";
        throw err;
      }
      if (res.status === 404) throw new Error("The desk is not on the main folder yet. Open this page again after that update is saved.");
      if (!res.ok) throw new Error("The notes could not be opened (" + res.status + ").");
      return res.text();
    }

    function blob(source) {
      return URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
    }

    async function openDesk(token) {
      msg("Loading the latest notes…");
      const files = {};
      for (const path of FILES) files[path] = await gh(path, token);
      const style = document.createElement("style");
      style.textContent = files["iphone/www/styles.css"];
      document.head.appendChild(style);
      const map = {
        "./markdown.js": blob(files["iphone/www/markdown.js"]),
        "./gates.js": blob(files["iphone/www/gates.js"]),
        "./remote.js": blob(files["iphone/www/remote.js"]),
      };
      let app = files["iphone/www/app.js"];
      for (const [spec, url] of Object.entries(map)) app = app.split('from "' + spec + '"').join('from "' + url + '"');
      document.getElementById("setup").hidden = true;
      document.getElementById("desk").hidden = false;
      await import(blob(app));
    }

    async function save(token) {
      const trimmed = token.trim();
      if (!trimmed) {
        msg("Paste the key first.");
        return;
      }
      localStorage.setItem(KEY, trimmed);
      try {
        await openDesk(trimmed);
      } catch (err) {
        if (err.code === "key") {
          localStorage.removeItem(KEY);
          msg("That key did not work. Make a new one and paste it again.");
          return;
        }
        msg(err.message || "The notes did not load.");
      }
    }

    document.getElementById("save-key").addEventListener("click", () => {
      save(document.getElementById("read-key").value);
    });

    const saved = (localStorage.getItem(KEY) || "").trim();
    if (saved) {
      openDesk(saved).catch((err) => {
        document.getElementById("setup").hidden = false;
        document.getElementById("desk").hidden = true;
        if (err.code === "key") {
          localStorage.removeItem(KEY);
          msg("That key did not work. Make a new one and paste it again.");
        } else {
          msg(err.message || "The notes did not load. Open HYDRA again when you have service.");
        }
      });
    }
  </script>
</body>
</html>
